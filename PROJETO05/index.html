<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 05 - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<body class="bg-light">
    <div class="container my-5">

            <button class="btn-close" type="button" data-btn-dismiss="alert"></button>

        <div class="d-flex justify-content-between aling-items-center mb-4">
            <h2>Gestão de projetos</h2>

                + Novo Projeto
            </button>
        </div>

                        <tr>
                            <th>projetos</th>
                            <th>conceito principal</th>

                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>01.Cartão de perfil</td>
                            <td>containers e Espaçamentos</td>
                            <td><span class="badge bg-success">Concluído</span></td>
                            <td>Ver</td>
                        </tr>
                        <tr></tr>
                        <tr></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
